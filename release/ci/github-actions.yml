# Step 4 Release - GitHub Actions: PR gate on STAGING, release to PROD after human approval.
# Copy to .github/workflows/agent-eval.yml (paths assume the kit is the repository root; if it lives in a
# sub-directory, set `working-directory`, the `paths` filters and the out/ paths below to that directory).
#   pr       every PR + every push to main: dependency scan (Amazon Inspector), deploy the candidate to STAGING with
#            the deploy role, then switch to the
#            gate role (no deploy, no endpoint changes) and run the gate (acceptance + sim segments, bundle version
#            as baggage), record the decision in SSM, upload the report
#   release  push to main only, after `pr` passed: `environment: production` (Settings -> Environments ->
#            production -> Required reviewers = the human approval), then release.sh moves PROD
#            (required reviewers need a public repository or GitHub Team / Enterprise for private ones)
# Trust: the pr job runs in GitHub environment `staging`, the release job in `production`; the OIDC roles trust only those
# environments (release/ci/github-oidc-roles.yaml). Give `staging` required reviewers so an unreviewed pull request
# cannot obtain the deploy role, and protect release/, define/, evaluate/, common/ with CODEOWNERS + branch protection:
# the gate's code ships in the commit it judges (see README "Security model"). Actions are pinned to commit SHAs and
# Python packages are installed from a hash-pinned lock (release/ci/requirements.lock).
# Repo settings: secrets AWS_DEPLOY_ROLE_ARN (STAGING deploy) + AWS_ROLE_ARN (gate) + AWS_RELEASE_ROLE_ARN (release),
#                OIDC roles from release/ci/github-oidc-roles.yaml (stack outputs = the three secrets), vars AWS_REGION,
#                AGENT_RUNTIME_ARN, GATEWAY_ID, BUNDLE_ID, BUNDLE_VERSION (optional: the Config bundle to gate + ship).
# One STAGING endpoint is shared, so the gate job is serialized (concurrency group, never cancelled mid-run).
name: agent-eval
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  id-token: write        # OIDC -> short-lived AWS credentials, no access keys in the repo
  contents: read
  pull-requests: write
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AGENT_RUNTIME_ARN: ${{ vars.AGENT_RUNTIME_ARN }}
  GATEWAY_ID: ${{ vars.GATEWAY_ID }}
  BUNDLE_ID: ${{ vars.BUNDLE_ID }}
  BUNDLE_VERSION: ${{ vars.BUNDLE_VERSION }}
  AGENT_ENDPOINT: STAGING
  GIT_COMMIT: ${{ github.sha }}
  PYTHON: python
jobs:
  pr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging                 # OIDC subject repo:<owner>/<repo>:environment:staging
    concurrency:
      group: evaldeck-staging            # deploy lock: one candidate on STAGING at a time
      cancel-in-progress: false
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      gate_key: ${{ steps.gate.outputs.gate_key }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Deploy role (CDK deploy + STAGING only; PROD / DEFAULT denied)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Install
        run: |
          pip install --require-hashes -r release/ci/requirements.lock   # kit requirements + uv, hash-pinned
          npm i -g @aws/agentcore@1.0.1
          (cd agent/evaldeck/agentcore/cdk && npm ci)
      - name: Dependency scan (Amazon Inspector SBOM; blocks before anything is deployed)
        run: bash release/ci/security_scan.sh
      - name: Deploy candidate to STAGING
        run: bash release/deploy_staging.sh
      - name: Gate role (no deploy, no endpoint changes)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Gate on STAGING (acceptance + sim)
        id: gate
        run: |
          set +e
          bash release/ci/gate_step.sh
          rc=$?
          python -c "import json; r = json.load(open('out/gate-report.json')); print('decision=' + r['decision']); print('gate_key=' + r['gate_key'])" >> "$GITHUB_OUTPUT"
          exit $rc
      - name: Record decision (SSM; main only, release reads records written from the protected branch)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('out/gate-report.json') != ''
        run: python release/record.py
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: gate-report
          path: |
            out/security-report.json
            out/staging.json
            out/gate-report.json
            out/*.results.json
      - name: Comment decision on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('out/gate-report.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > comment.md
          import json
          r = json.load(open("out/gate-report.json"))
          print(f"### Agent eval gate: **{r['decision']}**  (gate_key `{r['gate_key']}`, dataset v{(r.get('dataset') or {}).get('version')})")
          print("| segment | metric | tier | mean | threshold | baseline | status |\n|---|---|---|---|---|---|---|")
          for m in r["metrics"]:
              print(f"| {m['segment']} | {m['metric']} | {m['tier']} | {m['mean']} | {m['threshold']} | {m['baseline']} | {m['status']} |")
          for why in r["reasons"]:
              print(f"- {why}")
          PY
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
  release:
    needs: pr
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.pr.outputs.decision == 'PASS'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production              # required reviewers = the human approval before PROD moves
    concurrency:
      group: evaldeck-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: gate-report
          path: out
      - name: Install
        run: pip install --require-hashes -r release/ci/requirements.lock
      - name: Release to PROD (requires the PASS record for this gate_key)
        env:
          APPROVED_BY: "github environment production, run ${{ github.run_id }} (reviewer in the run log)"
        run: bash release/release.sh
