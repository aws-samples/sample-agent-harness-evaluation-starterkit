# Step 4 Release - gate waivers read by release/gate.py (default --waivers release/waivers.yaml).
# A waiver lets a named approver ship while ONE `gate` metric is below its threshold but above a floor, until a date.
# It never covers: red lines (refused, reported), regressions vs the baseline, missing measurements, evaluator
# errors, a Config bundle that was not verified. Expired or incomplete entries are ignored and reported.
# Fields: metric (required), segment (optional: acceptance | sim; default all), floor, expires (YYYY-MM-DD),
#         approver, reason (all required), ticket (optional). Keep the list short and the expiry close.
# Format: release/waivers.example.yaml. The waiver used in the reference run: examples/reference-run-20261106/.
waivers: []
